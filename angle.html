  <!DOCTYPE html>
  <html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📐 量角度</title>
    <style>
      *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
      html,body{height:100%;overflow:hidden;}
      body{font-family:'Segoe UI',Arial,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;height:100%;}

      #topbar{flex-shrink:0;background:#1e293b;padding:6px 10px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;border-bottom:1px solid #334155;}
      #topbar h1{font-size:0.88rem;color:#38bdf8;flex:1;white-space:nowrap;}
      .btn{padding:6px 10px;border-radius:7px;border:none;cursor:pointer;font-size:0.76rem;font-weight:600;white-space:nowrap;transition:transform .1s;}
      .btn:active{transform:scale(.93);}
      .b-blue{background:#3b82f6;color:#fff;} .b-ind{background:#6366f1;color:#fff;}
      .b-red{background:#ef4444;color:#fff;}   .b-yel{background:#f59e0b;color:#0f172a;}
      .b-grn{background:#22c55e;color:#0f172a;}.b-gray{background:#334155;color:#e2e8f0;}
      .btn:disabled{opacity:.35;cursor:not-allowed;}

      #toolbar{flex-shrink:0;display:flex;background:#1e293b;border-bottom:2px solid #334155;}
      .tb{flex:1;padding:7px 4px;border:none;cursor:pointer;font-size:0.76rem;font-weight:600;background:#1e293b;color:#64748b;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;}
      .tb.on{color:#38bdf8;border-bottom-color:#38bdf8;background:#0f172a;}

      #hint{flex-shrink:0;text-align:center;font-size:0.76rem;padding:4px 8px;background:#1e293b;color:#94a3b8;border-bottom:1px solid #334155;min-height:24px;line-height:1.4;}
      #hint b{color:#facc15;}

      /* canvas 區 */
      #canvas-wrap{flex:1;min-height:0;position:relative;background:#0a0f1e;overflow:hidden;}
      #zoom-layer{position:absolute;transform-origin:0 0;cursor:crosshair;}
      #mainCanvas{display:block;}
      #no-img{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#475569;text-align:center;pointer-events:none;}

      /* 縮放快捷列 */
      #zoom-bar{
        position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
        display:none;gap:4px;z-index:10;
        background:#1e293b99;backdrop-filter:blur(6px);
        border-radius:10px;padding:5px 8px;border:1px solid #334155;
      }
      #zoom-bar.show{display:flex;}
      .zb{
        padding:5px 9px;border-radius:6px;border:none;
        background:#334155;color:#e2e8f0;font-size:0.72rem;
        cursor:pointer;font-weight:600;white-space:nowrap;
      }
      .zb:active{background:#475569;}
      .zb.sep{background:transparent;color:#475569;padding:5px 2px;cursor:default;}
      #zoom-pct{font-size:0.7rem;color:#94a3b8;padding:5px 4px;min-width:38px;text-align:center;}

      /* 底部 */
      #bottom-area{flex-shrink:0;background:#0f172a;border-top:1px solid #334155;max-height:40vh;overflow-y:auto;display:flex;flex-direction:column;}

      #adj-panel{display:none;background:#1e293b;padding:8px 10px;border-bottom:1px solid #334155;}
      #adj-panel.on{display:block;}
      #adj-title{font-size:0.74rem;color:#94a3b8;margin-bottom:5px;text-align:center;}
      .ps-row{display:flex;gap:5px;justify-content:center;margin-bottom:5px;flex-wrap:wrap;}
      .ps-btn{flex:1;min-width:46px;padding:5px;border-radius:6px;border:none;background:#334155;color:#e2e8f0;font-size:0.7rem;cursor:pointer;}
      .ps-btn.on{background:#3b82f6;color:#fff;}
      #adj-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:270px;margin:0 auto 5px;}
      .ag{padding:8px 0;border-radius:6px;border:none;background:#334155;color:#e2e8f0;font-size:0.88rem;cursor:pointer;text-align:center;}
      .ag:active{background:#475569;} .ag.x{background:transparent!important;pointer-events:none;}
      #adj-done{display:block;width:100%;max-width:270px;margin:0 auto;padding:6px;background:#22c55e;color:#0f172a;border:none;border-radius:6px;font-size:0.78rem;font-weight:700;cursor:pointer;}

      #res-wrap{flex:1;}
      #res-title{padding:4px 10px;font-size:0.68rem;color:#64748b;border-bottom:1px solid #334155;background:#1e293b;position:sticky;top:0;z-index:1;}
      .ri{display:flex;align-items:center;gap:5px;padding:5px 10px;border-bottom:1px solid #0f172a;font-size:0.76rem;}
      .ri:nth-child(even){background:#111827;}
      .ri-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
      .ri-name{flex:1;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
      .ri-val{font-weight:700;min-width:52px;text-align:right;}
      .rv-n{color:#38bdf8;}.rv-s{color:#f59e0b;}.rv-c{color:#14b8a6;}
      .bsm{padding:3px 6px;border-radius:4px;border:none;font-size:0.66rem;cursor:pointer;font-weight:600;}
      .bst{background:#1e293b;border:1px solid #334155;color:#94a3b8;}
      .bst.on{background:#f59e0b22;border-color:#f59e0b;color:#f59e0b;}
      .bsa{background:#334155;color:#e2e8f0;}
      .bsd{background:none;border:none;color:#ef4444;font-size:0.88rem;cursor:pointer;}

      #dl-bar{display:none;padding:6px 10px;gap:6px;justify-content:center;flex-wrap:wrap;background:#1e293b;border-top:1px solid #334155;}
      #dl-bar.on{display:flex;}

      #cam-ov{display:none;position:fixed;inset:0;background:#000;z-index:100;flex-direction:column;align-items:center;justify-content:center;}
      #cam-ov.on{display:flex;}
      #video{width:100%;max-height:80vh;object-fit:cover;}
      #cam-bar2{width:100%;padding:12px;display:flex;justify-content:space-around;align-items:center;background:#111;}
      #btnSnap{width:60px;height:60px;border-radius:50%;background:#fff;border:4px solid #38bdf8;cursor:pointer;font-size:1.4rem;}
      .csb{background:#334155;color:#fff;border:none;padding:8px 13px;border-radius:7px;font-size:0.8rem;cursor:pointer;}
      #galleryInput,#camFB{display:none;}

      #side{position:fixed;top:0;left:0;bottom:0;width:86vw;max-width:360px;background:#0f172a;border-right:1px solid #334155;z-index:90;transform:translateX(-100%);transition:transform .2s;display:flex;flex-direction:column;}
      #side.on{transform:none;}
      #side-head{padding:8px 10px;background:#1e293b;display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
      #side-body{flex:1;overflow-y:auto;padding:6px;}
      .dgroup{font-size:.72rem;color:#38bdf8;padding:8px 4px 4px;font-weight:700;}
      .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
      .card{background:#1e293b;border-radius:8px;overflow:hidden;position:relative;cursor:pointer;}
      .card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#0a0f1e;}
      .card .nm{font-size:.58rem;padding:3px 4px;color:#94a3b8;word-break:break-all;line-height:1.2;}
      .card .bd{font-size:.55rem;color:#64748b;padding:0 4px 3px;}
      .card .del{position:absolute;top:2px;right:2px;background:#000a;border:none;color:#ef4444;border-radius:4px;padding:2px 5px;font-size:.75rem;}
      #name-bar{flex-shrink:0;background:#0f172a;padding:3px 10px;font-size:.78rem;color:#e2e8f0;border-bottom:1px solid #334155;display:flex;gap:8px;align-items:center;}
      #name-txt{color:#facc15;font-weight:700;cursor:pointer;user-select:none;}
      #modal{display:none;position:fixed;inset:0;background:#000b;z-index:200;align-items:center;justify-content:center;}
      #modal.on{display:flex;}
      #modal-body{background:#1e293b;border-radius:12px;padding:16px;width:86vw;max-width:340px;font-size:.85rem;}
      #modal-body label{display:block;padding:6px 0;}
      #modal-body .btn{margin:6px 4px 0 0;}
      #res-title{cursor:pointer;user-select:none;display:flex;justify-content:space-between;}
      #res-wrap.min #res-list{display:none;}
      #res-wrap.min #res-arrow{transform:rotate(-90deg);}
      #res-arrow{transition:transform .15s;}


    </style>
  </head>
  <body>
  <button class="btn b-gray" onclick="toggleSide()">☰</button>

  <div id="topbar">
    <h1>📐 量角度</h1>
    <button class="btn b-blue" onclick="openCam()">📷 相機</button>
    <button class="btn b-ind"  onclick="$('galleryInput').click()">🖼 相簿</button>
    <button class="btn b-yel"  id="btnUndo"  onclick="undoStep()" disabled>↩ 上一步</button>
    <button class="btn b-red"  id="btnClear" onclick="clearAll()" disabled>🗑 全清</button>
  </div>

  <div id="toolbar">
    <button class="tb on" id="tb-pt"  onclick="setTool('pt')">📍 打點取角</button>
    <button class="tb"    id="tb-cir" onclick="setTool('cir')">⭕ 標三圓取角</button>
  </div>

  <div id="name-bar">📝 檔名前綴：<span id="name-txt" ondblclick="renamePrefix()">（未命名）</span>
  <button class="bsm bsa" onclick="renamePrefix()">✏</button></div>


  <div id="hint">📷 請先拍照或選取圖片</div>

  <div id="canvas-wrap">
    <div id="zoom-layer">
      <canvas id="mainCanvas"></canvas>
    </div>
    <div id="no-img"><div style="font-size:2.8rem">📐</div><p>拍照或選圖後開始量測<br><small style="color:#334155">雙指捏合縮放・底部快捷鍵</small></p></div>

    <!-- 縮放快捷列 -->
    <div id="zoom-bar">
      <button class="zb" onclick="zoomBy(0.25)">＋</button>
      <button class="zb" onclick="zoomBy(-0.25)">－</button>
      <div class="zb sep">|</div>
      <button class="zb" onclick="zoomFit()">全圖</button>
      <button class="zb" onclick="zoomFitW()">全寬</button>
      <button class="zb" onclick="zoomFitH()">全高</button>
      <div class="zb sep">|</div>
      <div id="zoom-pct">100%</div>
    </div>
  </div>

  <div id="bottom-area">
    <div id="adj-panel">
      <div id="adj-title">微調點位置</div>
      <div class="ps-row" id="ps-row"></div>
      <div id="adj-grid">
        <div class="ag x"></div>
        <button class="ag" onclick="mv(0,-5)">▲▲</button>
        <button class="ag" onclick="mv(0,-1)">▲</button>
        <div class="ag x"></div><div class="ag x"></div>
        <button class="ag" onclick="mv(-5,0)">◀◀</button>
        <button class="ag" onclick="mv(-1,0)">◀</button>
        <div class="ag x" id="adj-lbl" style="background:#1e293b;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.72rem;color:#64748b">●</div>
        <button class="ag" onclick="mv(1,0)">▶</button>
        <button class="ag" onclick="mv(5,0)">▶▶</button>
        <div class="ag x"></div>
        <button class="ag" onclick="mv(0,1)">▼</button>
        <button class="ag" onclick="mv(0,5)">▼▼</button>
        <div class="ag x"></div><div class="ag x"></div>
      </div>
      <button id="adj-done" onclick="closeAdj()">✅ 完成</button>
    </div>
    <div id="res-wrap" style="display:none">
      <div id="res-title" onclick="$('res-wrap').classList.toggle('min')">
        <span>📋 量測結果</span><span id="res-arrow">▼</span>
      </div>

      <div id="res-list"></div>
    </div>
    <div id="dl-bar">
      <button class="btn b-ind" id="btnSave" onclick="saveAll()">☁ 存到 GitHub</button>
      <button class="btn b-gray" onclick="dlOrig()">⬇ 原圖</button>
      <button class="btn b-grn"  onclick="dlMark()">⬇ 標記圖</button>
    </div>
  </div>

  <div id="cam-ov">
    <video id="video" autoplay playsinline muted></video>
    <div id="cam-bar2">
      <button class="csb" onclick="closeCam()">✕ 取消</button>
      <button id="btnSnap" onclick="snap()">📷</button>
      <button class="csb" onclick="flipCam()">🔄 翻轉</button>
    </div>
  </div>

  <input type="file" id="galleryInput" accept="image/*">
  <input type="file" id="camFB" accept="image/*" capture="environment">

  <div id="side">
    <div id="side-head">
      <b style="color:#38bdf8;flex:1">☁ 雲端照片</b>
      <button class="btn b-gray" id="btnAll" onclick="toggleAll()">展開全部</button>
      <button class="btn b-gray" onclick="loadList()">🔄</button>
      <button class="btn b-gray" onclick="toggleSide()">✕</button>
    </div>
    <div id="side-body"></div>
    <div id="pager" style="padding:6px;display:flex;justify-content:center;gap:8px;background:#1e293b"></div>
  </div>
  <div id="modal"><div id="modal-body"></div></div>


  <script>
  const $=id=>document.getElementById(id);
  const REPO='patrickwoolf/my-online-drive', BRANCH='main', DIR='assets/angle-measure';
  let namePrefix='';          // 存檔用的檔名前綴
  const TOKEN=()=>localStorage.getItem('gh_token')||'';
  const ghHeaders=raw=>({'Authorization':`token ${TOKEN()}`,'Accept':raw?'application/vnd.github.raw':'application/vnd.github.v3+json'});
  const apiUrl=p=>`https://api.github.com/repos/${REPO}/contents/${p.split('/').map(encodeURIComponent).join('/')}`;

  function ensureToken(){
    if(TOKEN())return true;
    const t=prompt('找不到 GitHub Token，請輸入：');
    if(t){localStorage.setItem('gh_token',t.trim());return true;}
    return false;
  }
  const blobToB64=b=>new Promise((ok,ng)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.onerror=ng;r.readAsDataURL(b);});

  function tsNow(d=new Date()){
    const p=n=>String(n).padStart(2,'0');
    return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
  }

  async function ghPut(name,blob){
    const url=apiUrl(`${DIR}/${name}`);
    let sha;
    const g=await fetch(url+`?ref=${BRANCH}&t=${Date.now()}`,{headers:ghHeaders()});
    if(g.ok)sha=(await g.json()).sha;
    const res=await fetch(url,{method:'PUT',headers:ghHeaders(),
      body:JSON.stringify({message:`add ${name}`,content:await blobToB64(blob),branch:BRANCH,sha})});
    if(!res.ok)throw new Error(name+' → '+res.status);
    return (await res.json()).content.sha;
  }
  async function ghDeleteIfExists(name){
    const url=apiUrl(`${DIR}/${name}`);
    const g=await fetch(url+`?ref=${BRANCH}&t=${Date.now()}`,{headers:ghHeaders()});
    if(g.ok)await ghDelete(name,(await g.json()).sha);
  }


  async function ghDelete(name,sha){
    const res=await fetch(apiUrl(`${DIR}/${name}`),{method:'DELETE',headers:ghHeaders(),
      body:JSON.stringify({message:`delete ${name}`,sha,branch:BRANCH})});
    if(!res.ok)throw new Error(name+' → '+res.status);
  }
  async function ghGetBlob(name){
    const res=await fetch(apiUrl(`${DIR}/${name}`)+`?ref=${BRANCH}&t=${Date.now()}`,{headers:ghHeaders(true)});
    if(!res.ok)throw new Error(name+' → '+res.status);
    return res.blob();
  }
  function openModal(html){$('modal-body').innerHTML=html;$('modal').classList.add('on');}
  function closeModal(){$('modal').classList.remove('on');}

  const ACOLS=['#ef4444','#22c55e','#3b82f6','#f59e0b','#a855f7','#ec4899','#f97316','#84cc16'];
  const CCOLS=['#14b8a6','#06b6d4','#8b5cf6','#f43f5e','#f59e0b','#84cc16'];

  let imgObj=null, origBlob=null;
  let tool='pt';
  let aIdx=0, cIdx=0;
  let wip=[], wipCircles=[];
  let angles=[], circles=[];
  let adj=null;

  // ══ 縮放 / 平移 ══
  let scale=1, ox=0, oy=0;          // ox,oy = zoom-layer 左上角偏移（px，相對於 canvas-wrap）
  let pinch0=null;                   // {dist, scale, cx, cy}
  let panStart=null;                 // 單指平移起點

  function wrapSize(){
    const w=$('canvas-wrap');
    return{ww:w.clientWidth,wh:w.clientHeight};
  }
  function cvSize(){
    const cv=$('mainCanvas');
    return{cw:cv.width,ch:cv.height};
  }

  // 套用 transform（用 translate + scale，origin 固定在 0,0）
  function applyT(){
    $('zoom-layer').style.transform=`translate(${ox}px,${oy}px) scale(${scale})`;
    $('zoom-pct').textContent=Math.round(scale*100)+'%';
  }

  // 以視窗中心為基準縮放
  function zoomAround(newScale, pivotWx, pivotWy){
    // pivot 是相對於 canvas-wrap 的座標
    // canvas 座標 = (pivot - offset) / scale
    const canvasX=(pivotWx-ox)/scale;
    const canvasY=(pivotWy-oy)/scale;
    scale=newScale;
    ox=pivotWx-canvasX*scale;
    oy=pivotWy-canvasY*scale;
    applyT();
  }

  function zoomBy(delta){
    if(!imgObj)return;
    const{ww,wh}=wrapSize();
    const ns=Math.max(0.05,scale+delta);   // ★ 最小 5%，不鎖 50%
    zoomAround(ns,ww/2,wh/2);
  }

  // 全圖：fit 到視窗（可能小於 1）
  function zoomFit(){
    if(!imgObj)return;
    const{ww,wh}=wrapSize();
    const{cw,ch}=cvSize();
    const s=Math.min(ww/cw,wh/ch);
    scale=s;
    ox=(ww-cw*s)/2;
    oy=(wh-ch*s)/2;
    applyT();
  }
  // 全寬：寬度 = 視窗寬
  function zoomFitW(){
    if(!imgObj)return;
    const{ww,wh}=wrapSize();
    const{cw,ch}=cvSize();
    scale=ww/cw;
    ox=0;
    oy=(wh-ch*scale)/2;
    applyT();
  }
  // 全高：高度 = 視窗高
  function zoomFitH(){
    if(!imgObj)return;
    const{ww,wh}=wrapSize();
    const{cw,ch}=cvSize();
    scale=wh/ch;
    ox=(ww-cw*scale)/2;
    oy=0;
    applyT();
  }

  // ── 雙指縮放 ──
  const wrap=$('canvas-wrap');

  wrap.addEventListener('wheel',e=>{
    if(!imgObj)return;
    e.preventDefault();
    const r=wrap.getBoundingClientRect();
    const f=e.deltaY<0?1.1:1/1.1;
    zoomAround(Math.max(0.05,scale*f),e.clientX-r.left,e.clientY-r.top);
  },{passive:false});

  wrap.addEventListener('touchstart',e=>{
    if(e.touches.length===2){
      e.preventDefault();
      const t0=e.touches[0],t1=e.touches[1];
      pinch0={
        dist:Math.hypot(t0.clientX-t1.clientX,t0.clientY-t1.clientY),
        scale,
        cx:(t0.clientX+t1.clientX)/2,
        cy:(t1.clientY+t0.clientY)/2
      };
      panStart=null;
    } else if(e.touches.length===1&&!adj){
      // 單指：先記錄，若沒點到任何點才平移
      panStart={tx:e.touches[0].clientX,ty:e.touches[0].clientY,ox,oy,moved:false};
    }
  },{passive:false});

  wrap.addEventListener('touchmove',e=>{
    if(e.touches.length===2&&pinch0){
      e.preventDefault();
      const t0=e.touches[0],t1=e.touches[1];
      const d=Math.hypot(t0.clientX-t1.clientX,t0.clientY-t1.clientY);
      const ns=Math.max(0.05,pinch0.scale*(d/pinch0.dist));
      const rect=wrap.getBoundingClientRect();
      zoomAround(ns, pinch0.cx-rect.left, pinch0.cy-rect.top);
    } else if(e.touches.length===1&&panStart&&!adj){
      const dx=e.touches[0].clientX-panStart.tx;
      const dy=e.touches[0].clientY-panStart.ty;
      if(Math.hypot(dx,dy)>4) panStart.moved=true;
      if(panStart.moved){
        e.preventDefault();
        ox=panStart.ox+dx;
        oy=panStart.oy+dy;
        applyT();
      }
    }
  },{passive:false});

  wrap.addEventListener('touchend',e=>{
    if(e.touches.length<2) pinch0=null;
    if(e.touches.length===0){
      if(panStart&&panStart.moved) panStart=null; // 平移結束，不觸發 click
    }
  });

  // ── canvas 座標（考慮 ox,oy,scale）──
  function cxy(e){
    const rect=wrap.getBoundingClientRect();
    const wx=e.clientX-rect.left;
    const wy=e.clientY-rect.top;
    return{x:(wx-ox)/scale, y:(wy-oy)/scale};
  }

  // ══ 相機 ══
  let camStream=null, camFace='environment';
  async function openCam(){
    if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
      try{
        if(camStream)camStream.getTracks().forEach(t=>t.stop());
        camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:camFace},width:{ideal:1920},height:{ideal:1080}},audio:false});
        $('video').srcObject=camStream;$('cam-ov').classList.add('on');return;
      }catch(e){console.warn(e);}
    }
    $('camFB').click();
  }
  function closeCam(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}$('cam-ov').classList.remove('on');}
  function flipCam(){camFace=camFace==='environment'?'user':'environment';openCam();}
  function snap(){
    const v=$('video'),c=document.createElement('canvas');
    
    c.width=v.videoWidth;c.height=v.videoHeight;
    c.getContext('2d').drawImage(v,0,0);
    c.toBlob(b=>{origBlob=b;newPhoto();loadBlob(b);closeCam();},'image/jpeg',0.92);
  }
  $('galleryInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;origBlob=f;newPhoto();loadBlob(f);e.target.value='';});
  $('camFB').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;origBlob=f;newPhoto();loadBlob(f);e.target.value='';});
  function loadBlob(blob,state){
    const url=URL.createObjectURL(blob);
    imgObj=new Image();
    imgObj.onload=()=>{
      const cv=$('mainCanvas');
      cv.width=imgObj.naturalWidth;cv.height=imgObj.naturalHeight;
      $('no-img').style.display='none';
      $('zoom-bar').classList.add('show');
      $('dl-bar').classList.add('on');
      wip=[];wipCircles=[];angles=[];circles=[];aIdx=0;cIdx=0;
      if(state){angles=state.angles||[];circles=state.circles||[];aIdx=angles.length;cIdx=circles.length;}
      closeAdj();updateList();
      zoomFit();   // 載入後自動 fit
      drawAll();updateHint();
      $('btnClear').disabled=false;
    };
    imgObj.src=url;
  }

  // 工具切換
  function setTool(t){
    tool=t;
    $('tb-pt').classList.toggle('on',t==='pt');
    $('tb-cir').classList.toggle('on',t==='cir');
    wip=[];wipCircles=[];
    closeAdj();drawAll();updateHint();
    $('btnUndo').disabled=true;
  }

  // Canvas 點擊（透過 wrap 的 click，但只在非平移時觸發）
  $('mainCanvas').addEventListener('click',e=>{
    if(suppressClick){suppressClick=false;return;}

    if(!imgObj||adj)return;
    if(panStart&&panStart.moved){panStart=null;return;} // 剛平移完，忽略
    const{x,y}=cxy(e);
    const hit=findHit(x,y);
    if(hit){openAdj(hit);return;}

    if(tool==='pt'){
      const snap=snapCenter(x,y);
      wip.push(snap||{x,y});
      $('btnUndo').disabled=false;
      if(wip.length===3){
        commitAngle(wip[1],wip[0],wip[2]);   // 頂點=第②點，B=第①點，C=第③點
        wip=[];$('btnUndo').disabled=true;
      }

    } else {
      wip.push({x,y});
      $('btnUndo').disabled=false;
      if(wip.length===2){
        const p1=wip[0],p2=wip[1];
        const cx=(p1.x+p2.x)/2,cy=(p1.y+p2.y)/2;
        const r=Math.hypot(p2.x-p1.x,p2.y-p1.y)/2;
        const col=CCOLS[cIdx%CCOLS.length];cIdx++;
        const circ={id:Date.now(),color:col,p1:{...p1},p2:{...p2},center:{x:cx,y:cy},radius:r};
        circles.push(circ);wipCircles.push(circ);
        wip=[];updateList();
        if(wipCircles.length===3){
          const[c1,c2,c3]=wipCircles;
          // 頂點=O2，B=O1，C=O3
          commitAngle(c2.center,c1.center,c3.center,c2.id,c1.id,c3.id);
          wipCircles=[];$('btnUndo').disabled=true;
        }

      }
    }
    drawAll();updateHint();
  });

  function commitAngle(A,B,C,cidA,cidB,cidC){
    const col=ACOLS[aIdx%ACOLS.length];aIdx++;
    const pA={...A};if(cidA)pA._cid=cidA;
    const pB={...B};if(cidB)pB._cid=cidB;
    const pC={...C};if(cidC)pC._cid=cidC;
    angles.push({id:Date.now(),color:col,pts:[pA,pB,pC],deg:calcDeg(pA,pB,pC),showSupp:false});
    updateList();
  }

  function snapCenter(x,y){
    const cv=$('mainCanvas');
    const R=Math.max(cv.width,cv.height)*0.03;
    for(const c of circles)
      if(dist(c.center,{x,y})<R) return{x:c.center.x,y:c.center.y,_cid:c.id};
    return null;
  }

  // 拖曳（單指，在 canvas 上）
  let drag=null;
  // 滑鼠：拖點 / 拖空白處平移
  let mdrag=null, mpan=null, mmoved=false, suppressClick=false;
  $('mainCanvas').addEventListener('mousedown',e=>{
    if(!imgObj||e.button!==0)return;
    const{x,y}=cxy(e);
    const hit=findHit(x,y);
    mmoved=false;
    if(hit){mdrag=hit;}
    else{mpan={sx:e.clientX,sy:e.clientY,ox,oy};}
    e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{
    if(mdrag){
      mmoved=true;
      const{x,y}=cxy(e);
      applyDrag(mdrag,x,y);drawAll();
    }else if(mpan){
      const dx=e.clientX-mpan.sx, dy=e.clientY-mpan.sy;
      if(!mmoved&&Math.hypot(dx,dy)<4)return;   // 小於 4px 視為點擊
      mmoved=true;
      ox=mpan.ox+dx;oy=mpan.oy+dy;applyT();
      $('mainCanvas').style.cursor='grabbing';
    }
  });
  window.addEventListener('mouseup',()=>{
    if(!mdrag&&!mpan)return;
    suppressClick=mmoved;          // 有拖動就不觸發 click（不會誤打點）
    if(mdrag)updateList();
    mdrag=null;mpan=null;
    $('mainCanvas').style.cursor='';
    setTimeout(()=>suppressClick=false,0);
  });

  $('mainCanvas').addEventListener('touchstart',e=>{
    if(!imgObj||e.touches.length!==1)return;
    const{x,y}=cxy(e.touches[0]);
    const hit=findHit(x,y);
    if(hit){e.stopPropagation();e.preventDefault();drag=hit;panStart=null;}
  },{passive:false});
  $('mainCanvas').addEventListener('touchmove',e=>{
    if(!drag||e.touches.length!==1)return;
    e.preventDefault();
    const{x,y}=cxy(e.touches[0]);
    applyDrag(drag,x,y);drawAll();
  },{passive:false});
  $('mainCanvas').addEventListener('touchend',()=>{if(drag){updateList();drag=null;}});

  function findHit(x,y){
    const cv=$('mainCanvas');
    const R=Math.max(cv.width,cv.height)*0.028;
    for(let i=0;i<angles.length;i++)
      for(let p=0;p<3;p++)
        if(dist(angles[i].pts[p],{x,y})<R) return{kind:'angle',idx:i,pi:p};
    for(let i=0;i<circles.length;i++){
      if(dist(circles[i].p1,{x,y})<R) return{kind:'circle',idx:i,pi:0};
      if(dist(circles[i].p2,{x,y})<R) return{kind:'circle',idx:i,pi:1};
    }
    for(let p=0;p<wip.length;p++)
      if(dist(wip[p],{x,y})<R) return{kind:'wip',idx:-1,pi:p};
    return null;
  }

  function applyDrag(hit,x,y){
    if(hit.kind==='angle'){
      angles[hit.idx].pts[hit.pi]={...angles[hit.idx].pts[hit.pi],x,y};
      angles[hit.idx].deg=calcDeg(...angles[hit.idx].pts);
    } else if(hit.kind==='circle'){
      const c=circles[hit.idx];
      if(hit.pi===0)c.p1={x,y};else c.p2={x,y};
      c.center={x:(c.p1.x+c.p2.x)/2,y:(c.p1.y+c.p2.y)/2};
      c.radius=Math.hypot(c.p2.x-c.p1.x,c.p2.y-c.p1.y)/2;
      syncCircle(c);
    } else if(hit.kind==='wip'){
      wip[hit.pi]={x,y};
    }
  }

  function syncCircle(circ){
    for(const a of angles){
      for(let i=0;i<3;i++)
        if(a.pts[i]._cid===circ.id)
          a.pts[i]={...a.pts[i],x:circ.center.x,y:circ.center.y};
      a.deg=calcDeg(...a.pts);
    }
  }

  // 微調
  function openAdj(hit){adj=hit;$('adj-panel').classList.add('on');renderPS();updateAdjLbl();drawAll();}
  function renderPS(){
    const row=$('ps-row');row.innerHTML='';
    const labels={angle:['頂點','B點','C點'],circle:['端點①','端點②'],wip:wip.map((_,i)=>['①','②頂','③'][i])}[adj.kind]||[];
    labels.forEach((l,pi)=>{
      const b=document.createElement('button');
      b.className='ps-btn'+(adj.pi===pi?' on':'');b.textContent=l;
      b.onclick=()=>{adj={...adj,pi};renderPS();updateAdjLbl();drawAll();};
      row.appendChild(b);
    });
    $('adj-title').textContent='微調：'+({angle:`角度${adj.idx+1}`,circle:`圓${adj.idx+1}`,wip:'進行中'}[adj.kind]||'');
  }
  function updateAdjLbl(){
    $('adj-lbl').textContent=({angle:['頂','B','C'],circle:['①','②'],wip:['①','②頂','③']}[adj.kind]||[])[adj.pi]||'●';
  }
  function closeAdj(){adj=null;$('adj-panel').classList.remove('on');updateList();drawAll();}

  function mv(dx,dy){
    if(!adj)return;
    // dx,dy 是 canvas 原始像素單位（不受縮放影響）
    if(adj.kind==='angle'){
      angles[adj.idx].pts[adj.pi].x+=dx;
      angles[adj.idx].pts[adj.pi].y+=dy;
      angles[adj.idx].deg=calcDeg(...angles[adj.idx].pts);
    } else if(adj.kind==='circle'){
      const c=circles[adj.idx];
      if(adj.pi===0){c.p1.x+=dx;c.p1.y+=dy;}else{c.p2.x+=dx;c.p2.y+=dy;}
      c.center={x:(c.p1.x+c.p2.x)/2,y:(c.p1.y+c.p2.y)/2};
      c.radius=Math.hypot(c.p2.x-c.p1.x,c.p2.y-c.p1.y)/2;
      syncCircle(c);
    } else if(adj.kind==='wip'){
      wip[adj.pi].x+=dx;wip[adj.pi].y+=dy;
    }
    drawAll();updateList();
  }

  function calcDeg(A,B,C){
    const AB={x:B.x-A.x,y:B.y-A.y},AC={x:C.x-A.x,y:C.y-A.y};
    const dot=AB.x*AC.x+AB.y*AC.y;
    const cos=Math.max(-1,Math.min(1,dot/(Math.hypot(AB.x,AB.y)*Math.hypot(AC.x,AC.y))));
    return parseFloat((Math.acos(cos)*180/Math.PI).toFixed(1));
  }
  function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}

  // 繪製
  function drawAll(){
    const cv=$('mainCanvas'),ctx=cv.getContext('2d');
    ctx.clearRect(0,0,cv.width,cv.height);
    if(imgObj)ctx.drawImage(imgObj,0,0);
    const R=Math.max(cv.width,cv.height)*0.013;
    circles.forEach((c,i)=>drawCircle(ctx,c,R,i));
    if(tool==='cir'&&wip.length===1){
      drawDot(ctx,wip[0],CCOLS[cIdx%CCOLS.length],R,'端①');
    }
    angles.forEach(a=>{
      const d=a.showSupp?(180-a.deg).toFixed(1):a.deg.toFixed(1);
      drawAngle(ctx,a.pts,a.color,R,d,a.showSupp);
    });
    if(tool==='pt'&&wip.length>0){
      const col=ACOLS[aIdx%ACOLS.length];
      if(wip.length>=2){
        ctx.beginPath();ctx.moveTo(wip[0].x,wip[0].y);ctx.lineTo(wip[1].x,wip[1].y);
        ctx.strokeStyle=col;ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.stroke();ctx.setLineDash([]);
      }
      ['①','②頂','③'].forEach((l,i)=>{if(wip[i])drawDot(ctx,wip[i],col,R,l);});    }
    if(adj){
      let p=null;
      if(adj.kind==='angle')p=angles[adj.idx]?.pts[adj.pi];
      else if(adj.kind==='circle'){const c=circles[adj.idx];p=adj.pi===0?c?.p1:c?.p2;}
      else p=wip[adj.pi];
      if(p){
        ctx.beginPath();ctx.arc(p.x,p.y,R*2.2,0,Math.PI*2);
        ctx.strokeStyle='#facc15';ctx.lineWidth=3;ctx.setLineDash([5,3]);ctx.stroke();ctx.setLineDash([]);
      }
    }
  }

  function drawCircle(ctx,c,R,i){
    ctx.beginPath();ctx.arc(c.center.x,c.center.y,c.radius,0,Math.PI*2);
    ctx.strokeStyle=c.color+'bb';ctx.lineWidth=2;ctx.setLineDash([]);ctx.stroke();
    ctx.beginPath();ctx.moveTo(c.p1.x,c.p1.y);ctx.lineTo(c.p2.x,c.p2.y);
    ctx.strokeStyle=c.color+'55';ctx.lineWidth=1.5;ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(c.center.x,c.center.y,R,0,Math.PI*2);
    ctx.fillStyle=c.color;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    txt(ctx,`O${i+1}`,c.center.x+R+3,c.center.y-R,R,c.color);
    drawDot(ctx,c.p1,c.color,R*0.65,'');
    drawDot(ctx,c.p2,c.color,R*0.65,'');
  }

  function drawAngle(ctx,pts,col,R,degStr,isSupp){
    const[A,B,C]=pts;ctx.setLineDash([]);
    if(isSupp){
      const dir={x:A.x-B.x,y:A.y-B.y};
      const dL=Math.hypot(dir.x,dir.y)||1;
      const eE={x:A.x+(dir.x/dL)*dL*1.6,y:A.y+(dir.y/dL)*dL*1.6};
      ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(eE.x,eE.y);
      ctx.strokeStyle=col;ctx.lineWidth=2;ctx.setLineDash([8,5]);ctx.stroke();ctx.setLineDash([]);
      ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(C.x,C.y);
      ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.stroke();
      ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);
      ctx.strokeStyle=col+'44';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.stroke();ctx.setLineDash([]);
      const aE=Math.atan2(eE.y-A.y,eE.x-A.x),aC=Math.atan2(C.y-A.y,C.x-A.x);
      ctx.beginPath();ctx.arc(A.x,A.y,R*3,aE,aC,false);
      ctx.strokeStyle='#f59e0b';ctx.lineWidth=2.5;ctx.stroke();
      ctx.beginPath();ctx.arc(A.x,A.y,R*3,aE,aC,false);
      ctx.lineTo(A.x,A.y);ctx.closePath();ctx.fillStyle='#f59e0b33';ctx.fill();
      const mid=(aE+aC)/2;
      txt(ctx,degStr+'°',A.x+Math.cos(mid)*R*5.5,A.y+Math.sin(mid)*R*5.5,R,'#f59e0b');
    } else {
      [[A,B],[A,C]].forEach(([p1,p2])=>{
        ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);
        ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.stroke();
      });
      const a1=Math.atan2(B.y-A.y,B.x-A.x),a2=Math.atan2(C.y-A.y,C.x-A.x);
      ctx.beginPath();ctx.arc(A.x,A.y,R*3,a1,a2,false);
      ctx.strokeStyle=col;ctx.lineWidth=2;ctx.stroke();
      ctx.beginPath();ctx.arc(A.x,A.y,R*3,a1,a2,false);
      ctx.lineTo(A.x,A.y);ctx.closePath();ctx.fillStyle=col+'33';ctx.fill();
      const mid=(a1+a2)/2;
      txt(ctx,degStr+'°',A.x+Math.cos(mid)*R*5.5,A.y+Math.sin(mid)*R*5.5,R,col);
    }
    ['頂','B','C'].forEach((l,i)=>drawDot(ctx,pts[i],col,R,l));
  }

  function drawDot(ctx,p,col,R,lbl){
    ctx.beginPath();ctx.arc(p.x,p.y,R,0,Math.PI*2);
    ctx.fillStyle=col;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    if(lbl)txt(ctx,lbl,p.x+R+3,p.y-R,R,'#fff');
  }
  function txt(ctx,s,x,y,R,col){
    ctx.font=`bold ${R*1.35}px Arial`;
    ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(s,x,y);
    ctx.fillStyle=col;ctx.fillText(s,x,y);
  }

  function updateHint(){
    if(!imgObj){$('hint').innerHTML='📷 請先拍照或選取圖片';return;}
    if(tool==='cir'){
      const n=wipCircles.length,h=wip.length;
      const msgs=[
        '⭕ 標圓1：點直徑 <b>端點①</b>','⭕ 標圓1：點直徑 <b>端點②</b>',
        '⭕ 標圓2：點直徑 <b>端點①</b>（此圓為頂點）','⭕ 標圓2：點直徑 <b>端點②</b>（此圓為頂點）',
        '⭕ 標圓3：點直徑 <b>端點①</b>（完成後自動取角）','⭕ 標圓3：點直徑 <b>端點②</b>（完成後自動取角）'
      ];
      $('hint').innerHTML=msgs[n*2+h]||msgs[0];
    } else {
      const m=['📍 點 <b>①第一點</b>','📍 點 <b>②頂點</b>（靠近圓心自動吸附）','📍 點 <b>③第三點</b>'];
      $('hint').innerHTML=m[wip.length]||m[0];
    }
  }

  function updateList(){
    const wrap=$('res-wrap'),list=$('res-list');
    if(!angles.length&&!circles.length){wrap.style.display='none';return;}
    wrap.style.display='block';list.innerHTML='';
    circles.forEach((c,i)=>{
      const d=document.createElement('div');d.className='ri';
      d.innerHTML=`<div class="ri-dot" style="background:${c.color}"></div>
        <div class="ri-name">⭕ 圓${i+1}</div>
        <div class="ri-val rv-c">r≈${c.radius.toFixed(1)}px</div>
        <button class="bsm bsa" onclick='openAdj({kind:"circle",idx:${i},pi:0})'>🎯</button>
        <button class="bsd" onclick="delCircle(${c.id})">✕</button>`;
      list.appendChild(d);
    });
    angles.forEach((a,i)=>{
      const ob=a.deg>90;
      const dv=a.showSupp?(180-a.deg).toFixed(1):a.deg.toFixed(1);
      const d=document.createElement('div');d.className='ri';
      d.innerHTML=`<div class="ri-dot" style="background:${a.color}"></div>
        <div class="ri-name">📐 角度${i+1}</div>
        <div class="ri-val ${a.showSupp?'rv-s':'rv-n'}">${dv}°${a.showSupp?'<br><small style="font-size:.58rem;color:#64748b">延長線夾角</small>':''}</div>
        ${ob?`<button class="bsm bst ${a.showSupp?'on':''}" onclick="togS(${a.id})">${a.showSupp?'↩原角':'↔延長'}</button>`:'<div style="width:38px"></div>'}
        <button class="bsm bsa" onclick='openAdj({kind:"angle",idx:${i},pi:0})'>🎯</button>
        <button class="bsd" onclick="delA(${a.id})">✕</button>`;
      list.appendChild(d);
    });
  }

  function togS(id){const a=angles.find(x=>x.id===id);if(a){a.showSupp=!a.showSupp;updateList();drawAll();}}
  function delA(id){angles=angles.filter(a=>a.id!==id);updateList();drawAll();}
  function delCircle(id){circles=circles.filter(c=>c.id!==id);updateList();drawAll();}

  function undoStep(){
    if(tool==='pt'&&wip.length>0){wip.pop();}
    else if(tool==='cir'){
      if(wip.length>0){wip.pop();}
      else if(wipCircles.length>0){
        const last=wipCircles.pop();
        circles=circles.filter(c=>c.id!==last.id);
        updateList();
      }
    }
    if(!wip.length&&!wipCircles.length)$('btnUndo').disabled=true;
    drawAll();updateHint();
  }
  function clearAll(){
    angles=[];circles=[];wip=[];wipCircles=[];aIdx=0;cIdx=0;
    $('btnUndo').disabled=true;closeAdj();updateList();drawAll();updateHint();
  }

  let cur=null;                 // 目前這張在雲端的狀態 {ts,prefix,ext,sha}
  let upP=Promise.resolve();    // 自動上傳的 Promise，存檔前會等它完成
  const nameOf=(p,ts)=>(p?p+'_':'')+ts;

  function newPhoto(){          // 拍照 / 相簿選圖後呼叫
    namePrefix='';showName();cur=null;
    upP=uploadOrig();
  }
  async function uploadOrig(){
    const mine=origBlob;
    if(!mine||!ensureToken())return;
    const ts=tsNow(), ext=mine.type==='image/png'?'png':'jpg';
    $('hint').textContent='☁ 原圖自動上傳中…';
    try{
      const sha=await ghPut(`${nameOf(namePrefix,ts)}_orig.${ext}`,mine);
      if(origBlob===mine){cur={ts,prefix:namePrefix,ext,sha};updateHint();}
      if($('side').classList.contains('on'))loadList();
    }catch(e){
      cur=null;$('hint').textContent='⚠ 原圖自動上傳失敗，可按「存到 GitHub」重試';
    }
  }

  async function saveAll(){
    if(!imgObj||!origBlob){alert('請先載入圖片');return;}
    if(!ensureToken())return;
    closeAdj();
    const btn=$('btnSave');btn.disabled=true;btn.textContent='⏳ 上傳中…';
    try{
      await upP;
      if(!cur){await uploadOrig();}            // 自動上傳失敗或載入的是標記圖時，補傳原圖
      if(!cur)throw new Error('原圖尚未上傳');
      const cv=$('mainCanvas');
      const marked=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.95));
      const json=new Blob([JSON.stringify({
        version:1,prefix:namePrefix,w:cv.width,h:cv.height,
        angles:angles.map(a=>({id:a.id,color:a.color,pts:a.pts,deg:a.deg,showSupp:a.showSupp})),
        circles
      },null,1)],{type:'application/json'});

      const oldBase=nameOf(cur.prefix,cur.ts), newBase=nameOf(namePrefix,cur.ts);
      if(oldBase!==newBase){                   // 前綴有改：搬移原圖
        cur.sha=await ghPut(`${newBase}_orig.${cur.ext}`,origBlob);
        await ghDeleteIfExists(`${oldBase}_orig.${cur.ext}`);
        await ghDeleteIfExists(`${oldBase}_marked.jpg`);
        await ghDeleteIfExists(`${oldBase}.json`);
        cur.prefix=namePrefix;
      }
      await ghPut(`${newBase}_marked.jpg`,marked);
      await ghPut(`${newBase}.json`,json);
      alert('✅ 已存到 GitHub：\n'+newBase);
      if($('side').classList.contains('on'))loadList();
    }catch(e){alert('❌ 存檔失敗：'+e.message);}
    btn.disabled=false;btn.textContent='☁ 存到 GitHub';
  }


  let allSets=[], showAll=false, page=0;
  const PAGE=12, thumbCache=new Map();

  function toggleSide(){
    const s=$('side');s.classList.toggle('on');
    if(s.classList.contains('on'))loadList();
  }
  function toggleAll(){showAll=!showAll;page=0;$('btnAll').textContent=showAll?'只看一個月':'展開全部';renderList();}

  async function loadList(){
    if(!ensureToken())return;
    $('side-body').innerHTML='<p style="padding:10px;color:#64748b">載入中…</p>';
    const res=await fetch(apiUrl(DIR)+`?ref=${BRANCH}&t=${Date.now()}`,{headers:ghHeaders()});
    if(res.status===404){allSets=[];renderList();return;}
    if(!res.ok){$('side-body').textContent='讀取失敗 '+res.status;return;}
    const files=await res.json(), m={};
    files.forEach(f=>{
      const r=f.name.match(/^(.*)(\d{14})(?:_(orig|marked)\.(?:jpg|jpeg|png)|(\.json))$/);
      if(!r)return;
      const key=r[1]+r[2], kind=r[3]||'json';
      (m[key]=m[key]||{key,prefix:r[1].replace(/_$/,''),ts:r[2],files:{}}).files[kind]={name:f.name,sha:f.sha};
    });
    allSets=Object.values(m).sort((a,b)=>b.ts.localeCompare(a.ts));
    page=0;renderList();
  }

  function renderList(){
    const cutoff=tsNow(new Date(Date.now()-30*864e5));
    const sets=showAll?allSets:allSets.filter(s=>s.ts>=cutoff);
    const pages=Math.max(1,Math.ceil(sets.length/PAGE));
    if(page>=pages)page=pages-1;
    const cur=sets.slice(page*PAGE,(page+1)*PAGE);
    const body=$('side-body');body.innerHTML='';
    if(!cur.length)body.innerHTML='<p style="padding:10px;color:#64748b">沒有照片</p>';
    let lastDate='',grid=null;
    const io=new IntersectionObserver(es=>es.forEach(en=>{
      if(!en.isIntersecting)return;io.unobserve(en.target);loadThumb(en.target);
    }),{root:body});
    cur.forEach(s=>{
      const d=`${s.ts.slice(0,4)}-${s.ts.slice(4,6)}-${s.ts.slice(6,8)}`;
      if(d!==lastDate){
        lastDate=d;
        const h=document.createElement('div');h.className='dgroup';h.textContent='📅 '+d;body.appendChild(h);
        grid=document.createElement('div');grid.className='grid';body.appendChild(grid);
      }
      const f=s.files.orig||s.files.marked;
      const c=document.createElement('div');c.className='card';
      c.innerHTML=`<img data-name="${f?f.name:''}">
        <div class="nm">${s.prefix?s.prefix+' ':''}${s.ts.slice(8,10)}:${s.ts.slice(10,12)}:${s.ts.slice(12)}</div>
        <div class="bd">${s.files.orig?'原':'－'} ${s.files.marked?'標':'－'} ${s.files.json?'J':'－'}</div>
        <button class="del">🗑</button>`;
      c.onclick=()=>openChoice(s);
      c.querySelector('.del').onclick=e=>{e.stopPropagation();openDelete(s);};
      grid.appendChild(c);
      io.observe(c.querySelector('img'));
    });
    const pg=$('pager');
    pg.innerHTML=pages>1?`<button class="btn b-gray" ${page?'':'disabled'} onclick="page--;renderList()">◀</button>
      <span style="font-size:.76rem;padding:6px">${page+1} / ${pages}</span>
      <button class="btn b-gray" ${page<pages-1?'':'disabled'} onclick="page++;renderList()">▶</button>`:'';
  }

  async function loadThumb(img){
    const name=img.dataset.name;if(!name)return;
    try{
      if(!thumbCache.has(name))thumbCache.set(name,URL.createObjectURL(await ghGetBlob(name)));
      img.src=thumbCache.get(name);
    }catch(e){}
  }

  function openChoice(s){
    openModal(`<div style="margin-bottom:8px"><b>${s.prefix||s.ts}</b></div>
      <button class="btn b-blue" ${s.files.orig?'':'disabled'} onclick="loadSet('${s.key}','orig')">載入原始圖${s.files.json?'（還原點位）':''}</button>
      <button class="btn b-grn"  ${s.files.marked?'':'disabled'} onclick="loadSet('${s.key}','marked')">載入標記圖</button>
      <button class="btn b-gray" onclick="closeModal()">取消</button>`);
  }
  async function loadSet(key,kind){
    const s=allSets.find(x=>x.key===key);if(!s)return;
    closeModal();$('hint').textContent='⏳ 載入中…';
    try{
      const blob=await ghGetBlob(s.files[kind].name);
      let state=null;
      if(kind==='orig'&&s.files.json){
        try{state=JSON.parse(await (await ghGetBlob(s.files.json.name)).text());}catch(e){}
      }
      origBlob=blob;
      namePrefix=s.prefix;showName();
      cur=(kind==='orig')
        ?{ts:s.ts,prefix:s.prefix,ext:s.files.orig.name.split('.').pop(),sha:s.files.orig.sha}
        :null;                       // 載入標記圖時，存檔會當作新的一組
      upP=Promise.resolve();

      loadBlob(blob,state);
      toggleSide();
    }catch(e){alert('載入失敗：'+e.message);updateHint();}
  }

  function openDelete(s){
    const f=s.files,row=(k,t)=>f[k]?`<label><input type="checkbox" value="${k}"> ${t}</label>`:'';
    openModal(`<b>刪除 ${s.prefix||s.ts}</b>
      ${row('orig','原始圖')}${row('marked','標記圖')}${row('json','JSON 點位')}
      <button class="btn b-red" onclick="doDelete('${s.key}')">刪除勾選項目</button>
      <button class="btn b-gray" onclick="closeModal()">取消</button>`);
  }
  async function doDelete(key){
    const s=allSets.find(x=>x.key===key);
    const kinds=[...document.querySelectorAll('#modal-body input:checked')].map(i=>i.value);
    if(!kinds.length){alert('請至少勾選一項');return;}
    if(!confirm('確定刪除？無法復原'))return;
    try{for(const k of kinds)await ghDelete(s.files[k].name,s.files[k].sha);}
    catch(e){alert('刪除失敗：'+e.message);}
    closeModal();loadList();
  }

  function showName(){$('name-txt').textContent=namePrefix||'（未命名）';}
  function renamePrefix(){
    const v=prompt('存檔用的檔名前綴（可留空）：',namePrefix);
    if(v===null)return;
    namePrefix=v.trim().replace(/[\\/:*?"<>|#%\s]+/g,'_').replace(/^_+|_+$/g,'');
    showName();
  }

  function dlOrig(){if(!origBlob)return;const a=document.createElement('a');a.href=URL.createObjectURL(origBlob);a.download='orig_'+Date.now()+'.jpg';a.click();}
  function dlMark(){const cv=$('mainCanvas');const a=document.createElement('a');a.href=cv.toDataURL('image/jpeg',0.95);a.download='marked_'+Date.now()+'.jpg';a.click();}

  </script>
  </body>
  </html>
