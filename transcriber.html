<!DOCTYPE html>
  <html lang="zh-Hant"><head><meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gemini 轉錄</title>
  <style>
  body{font:16px system-ui;max-width:600px;margin:auto;padding:16px}
  select,button,input{width:100%;padding:12px;margin:6px 0;font-size:16px;box-sizing:border-box}
  textarea{width:100%;height:50vh;font-size:15px;box-sizing:border-box}
  </style></head><body>
  <h3>🎙 Gemini 音訊轉錄</h3>
  <input id="k" type="password" placeholder="AI Studio API Key">
  <input id="m" value="gemini-flash-latest">
  <select id="l">
   <option value="維持原語言">維持原語言</option>
   <option value="繁體中文">輸出繁體中文</option>
   <option value="粵語口語(用繁體中文字,保留粵語用字)">粵語口語</option>
  </select>
  <input type="file" id="f" accept=".mp3,.m4a,audio/*">
  <button id="go">開始轉錄</button>
  <div id="s">就緒</div>
  <textarea id="o" placeholder="結果顯示於此"></textarea>
  <button id="cp">複製</button>
  <button id="dl">下載 txt</button>
  <script>
  const $=i=>document.getElementById(i),S=t=>$("s").textContent=t,
  B="https://generativelanguage.googleapis.com";
  $("k").value=localStorage.k||"";
  $("go").onclick=async()=>{
   const f=$("f").files[0],key=$("k").value.trim();
   if(!key||!f)return S("請輸入 API Key 並選擇檔案");
   localStorage.k=key;$("go").disabled=true;$("o").value="";
   try{
    const mime=f.type||(/m4a$/i.test(f.name)?"audio/mp4":"audio/mpeg");
    S("上傳中…(大檔請耐心等候)");
    const st=await fetch(`${B}/upload/v1beta/files?key=${key}`,{method:"POST",headers:{
     "X-Goog-Upload-Protocol":"resumable","X-Goog-Upload-Command":"start",
     "X-Goog-Upload-Header-Content-Length":f.size,"X-Goog-Upload-Header-Content-Type":mime,
     "Content-Type":"application/json"},body:JSON.stringify({file:{display_name:f.name}})});
    const url=st.headers.get("x-goog-upload-url");
    if(!url)throw new Error("無法取得上傳網址,請檢查 API Key");
    const up=await fetch(url,{method:"POST",headers:{
     "X-Goog-Upload-Offset":0,"X-Goog-Upload-Command":"upload, finalize"},body:f});
    let file=(await up.json()).file;
    if(!file)throw new Error("上傳失敗");
    while(file.state=="PROCESSING"){
     S("伺服器處理音訊中…");await new Promise(r=>setTimeout(r,3000));
     file=await(await fetch(`${B}/v1beta/${file.name}?key=${key}`)).json();
    }
    if(file.state!="ACTIVE")throw new Error("檔案處理失敗:"+file.state);
    S("轉錄中…請保持畫面開啟");
    const res=await fetch(`${B}/v1beta/models/${$("m").value}:generateContent?key=${key}`,{
     method:"POST",headers:{"Content-Type":"application/json"},
     body:JSON.stringify({
      contents:[{parts:[
       {text:`請逐字完整轉錄這段音訊,不可摘要、省略、改寫或潤飾,保留所有語助詞、口吃與重複。語言/輸出:${$("l").value}。依說話內容自然分段,若有多位說話者請標示「說話者1:」等。只輸出逐字稿。`},
       {file_data:{mime_type:mime,file_uri:file.uri}}]}],
      generationConfig:{temperature:0.3,frequencyPenalty:0.3,maxOutputTokens:65536,thinkingConfig:{thinkingBudget:0}}
     })});
    const j=await res.json();
    if(j.error)throw new Error(j.error.message);
    const c=j.candidates?.[0];
    if(!c?.content?.parts)throw new Error("沒有輸出,原因:"+(c?.finishReason||j.promptFeedback?.blockReason||"未知")+" "+JSON.stringify(j.usageMetadata||{}));
    $("o").value=c.content.parts.filter(p=>!p.thought).map(p=>p.text).join("");
    if(!$("o").value.trim())throw new Error("輸出為空,原因:"+c.finishReason);
    S("完成 ✅"+(c.finishReason=="MAX_TOKENS"?"(輸出已達上限,請分段)":""));
    dl();
    fetch(`${B}/v1beta/${file.name}?key=${key}`,{method:"DELETE"});
   }catch(e){S("錯誤:"+e.message)}
   $("go").disabled=false;
  };
  $("cp").onclick=()=>navigator.clipboard.writeText($("o").value);
  const dl=()=>{const a=document.createElement("a"),f=$("f").files[0];a.href=URL.createObjectURL(new Blob([$("o").value]));a.download=(f?f.name.replace(/\.[^.]+$/,""):"transcript")+".txt";a.click()};
  $("dl").onclick=dl;
  </script></body></html>
