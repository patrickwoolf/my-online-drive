  <!DOCTYPE html>
  <html lang="zh-Hant"><head><meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gemini 轉錄</title>
  <style>
  body{font:16px system-ui;max-width:600px;margin:auto;padding:16px}
  select,button,input{width:100%;padding:12px;margin:6px 0;font-size:16px;box-sizing:border-box}
  textarea{width:100%;height:50vh;font-size:15px;box-sizing:border-box}
  #s{padding:6px 0;color:#333}
  </style></head><body>
  <h3>🎙 Gemini 音訊轉錄</h3>
  <input id="k" type="password" placeholder="AI Studio API Key">
  <input id="m" value="gemini-flash-latest">
  <select id="l">
   <option value="維持原語言">維持原語言</option>
   <option value="繁體中文">輸出繁體中文</option>
   <option value="粵語口語(用繁體中文字,保留粵語用字)">粵語口語</option>
  </select>
  <input type="file" id="f" accept=".mp3,.m4a,audio/*">
  <button id="up">① 上傳檔案</button>
  <button id="go">② 開始轉錄</button>
  <div id="s">就緒</div>
  <textarea id="o" placeholder="結果顯示於此"></textarea>
  <button id="cp">複製</button>
  <button id="dl">下載 txt</button>
  <button id="rm">刪除雲端檔案</button>
  <script>
  const $=i=>document.getElementById(i),S=t=>$("s").textContent=t,
  B="https://generativelanguage.googleapis.com",
  sleep=ms=>new Promise(r=>setTimeout(r,ms)),
  fid=f=>"up_"+f.name+"|"+f.size+"|"+f.lastModified,
  getC=f=>{try{const c=JSON.parse(localStorage.getItem(fid(f))||"null");
   if(c&&Date.now()-c.t<46*3600*1000)return c}catch(e){}return null},
  setC=(f,c)=>localStorage.setItem(fid(f),JSON.stringify({...c,t:Date.now()})),
  clrC=f=>localStorage.removeItem(fid(f)),
  mimeOf=f=>f.type||(/m4a$/i.test(f.name)?"audio/mp4":"audio/mpeg");

  $("k").value=localStorage.k||"";

  // 選檔時檢查是否已上傳過
  $("f").onchange=()=>{
   const f=$("f").files[0];if(!f)return;
   S(getC(f)?"此檔案已上傳過 ✅ 可直接按「開始轉錄」":"尚未上傳,請先按「① 上傳檔案」");
  };

  // ① 上傳
  $("up").onclick=async()=>{
   const f=$("f").files[0],key=$("k").value.trim();
   if(!key||!f)return S("請輸入 API Key 並選擇檔案");
   if(getC(f)&&!confirm("此檔案已上傳過,要重新上傳嗎?"))return S("沿用已上傳的檔案 ✅");
   localStorage.k=key;$("up").disabled=true;$("go").disabled=true;
   try{
    const mime=mimeOf(f);
    S("上傳中…(大檔請耐心等候)");
    const st=await fetch(`${B}/upload/v1beta/files?key=${key}`,{method:"POST",headers:{
     "X-Goog-Upload-Protocol":"resumable","X-Goog-Upload-Command":"start",
     "X-Goog-Upload-Header-Content-Length":f.size,"X-Goog-Upload-Header-Content-Type":mime,
     "Content-Type":"application/json"},body:JSON.stringify({file:{display_name:f.name}})});
    const url=st.headers.get("x-goog-upload-url");
    if(!url)throw new Error("無法取得上傳網址,請檢查 API Key");
    const up=await fetch(url,{method:"POST",headers:{
     "X-Goog-Upload-Offset":0,"X-Goog-Upload-Command":"upload, finalize"},body:f});
    let file=(await up.json()).file;
    if(!file)throw new Error("上傳失敗");
    while(file.state=="PROCESSING"){
     S("伺服器處理音訊中…");await sleep(3000);
     file=await(await fetch(`${B}/v1beta/${file.name}?key=${key}`)).json();
    }
    if(file.state!="ACTIVE")throw new Error("檔案處理失敗:"+file.state);
    setC(f,{uri:file.uri,name:file.name,mime});
    S("上傳完成 ✅ 現在可按「② 開始轉錄」(可重複轉錄,不用再上傳)");
   }catch(e){S("上傳錯誤:"+e.message)}
   $("up").disabled=false;$("go").disabled=false;
  };

  // 呼叫轉錄,遇到忙碌自動重試
  async function gen(model,key,body){
   const MAX=5;
   for(let i=0;i<=MAX;i++){
    S(i?`轉錄中…(第 ${i} 次重試)`:"轉錄中…請保持畫面開啟");
    const res=await fetch(`${B}/v1beta/models/${model}:generateContent?key=${key}`,{
     method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j=await res.json().catch(()=>({}));
    if(j.error){
     const code=j.error.code||res.status,msg=j.error.message||"";
     const busy=code==503||code==429||/high demand|overloaded|unavailable/i.test(msg);
     if(busy&&i<MAX){
      const w=10*2**i;
      for(let s=w;s>0;s--){S(`伺服器忙碌(${code}),${s} 秒後第 ${i+1} 次重試…`);await sleep(1000)}
      continue;
     }
     const e=new Error(msg);e.code=code;throw e;
    }
    return j;
   }
  }

  // ② 轉錄
  $("go").onclick=async()=>{
   const f=$("f").files[0],key=$("k").value.trim();
   if(!key||!f)return S("請輸入 API Key 並選擇檔案");
   const c=getC(f);
   if(!c)return S("此檔案尚未上傳,請先按「① 上傳檔案」");
   localStorage.k=key;$("go").disabled=true;$("up").disabled=true;$("o").value="";
   try{
    const j=await gen($("m").value.trim(),key,{
     contents:[{parts:[
      {text:`請逐字完整轉錄這段音訊,不可摘要、省略、改寫或潤飾,不要時間戳、省略語助詞、同一詞語不可連續超過兩次、無人聲就略過。語言/輸出:${$("l").value}。依說話內容自然分段,若有多位說話者請標示「說話者1:」等。只輸出逐字稿。`},
      {file_data:{mime_type:c.mime,file_uri:c.uri}}]}],
     generationConfig:{temperature:0.3,maxOutputTokens:65536,thinkingConfig:{thinkingBudget:0}}
    });
    const cand=j.candidates?.[0];
    if(!cand?.content?.parts)throw new Error("沒有輸出,原因:"+(cand?.finishReason||j.promptFeedback?.blockReason||"未知")+" "+JSON.stringify(j.usageMetadata||{}));
    $("o").value=cand.content.parts.filter(p=>!p.thought).map(p=>p.text).join("");
    if(/(.{1,6})(\s*[,,、]?\s*\1){15,}/.test($("o").value))throw new Error("偵測到重複迴圈,輸出無效,請分段或換模型重試");
    if(!$("o").value.trim())throw new Error("輸出為空,原因:"+cand.finishReason);
    S("完成 ✅"+(cand.finishReason=="MAX_TOKENS"?"(輸出已達上限,請分段)":""));
    dl();
   }catch(e){
    if(e.code==403||e.code==404){clrC(f);S("雲端檔案已過期或不存在,請重新按「① 上傳檔案」。("+e.message+")")}
    else S("錯誤:"+e.message);
   }
   $("go").disabled=false;$("up").disabled=false;
  };

  // 刪除雲端檔案
  $("rm").onclick=async()=>{
   const f=$("f").files[0],key=$("k").value.trim(),c=f&&getC(f);
   if(!c)return S("沒有可刪除的已上傳檔案");
   try{
    await fetch(`${B}/v1beta/${c.name}?key=${key}`,{method:"DELETE"});
    clrC(f);S("已刪除雲端檔案");
   }catch(e){S("刪除失敗:"+e.message)}
  };

  $("cp").onclick=()=>navigator.clipboard.writeText($("o").value);
  const dl=()=>{const a=document.createElement("a"),f=$("f").files[0];a.href=URL.createObjectURL(new Blob([$("o").value]));a.download=(f?f.name.replace(/\.[^.]+$/,""):"transcript")+".txt";a.click()};
  $("dl").onclick=dl;
  </script></body></html>
