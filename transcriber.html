  <!DOCTYPE html>
  <html lang="zh-Hant"><head><meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gemini 轉錄</title>
  <style>
  body{font:16px system-ui;max-width:600px;margin:auto;padding:16px}
  select,button,input{width:100%;padding:12px;margin:6px 0;font-size:16px;box-sizing:border-box}
  textarea{width:100%;height:50vh;font-size:15px;box-sizing:border-box}
  </style></head><body>
  <h3>🎙 Gemini 音訊轉錄</h3>
  <input id="k" type="password" placeholder="AI Studio API Key">
  <input id="m" value="gemini-flash-latest">
  <select id="l">
   <option value="維持原語言">維持原語言</option>
   <option value="繁體中文">輸出繁體中文</option>
   <option value="粵語口語(用繁體中文字,保留粵語用字)">粵語口語</option>
  </select>
  <input type="file" id="f" accept=".mp3,.m4a,audio/*">
  <button id="go">開始轉錄</button>
  <div id="s">就緒</div>
  <textarea id="o" placeholder="結果顯示於此"></textarea>
  <button id="cp">複製</button>
  <button id="dl">下載 txt</button>
  <script>
  const $=i=>document.getElementById(i);
  $("k").value=localStorage.k||"";
  $("go").onclick=async()=>{
   const f=$("f").files[0],key=$("k").value.trim();
   if(!key||!f)return $("s").textContent="請輸入 API Key 並選擇檔案";
   localStorage.k=key;
   if(f.size>14e6)return $("s").textContent="檔案超過約 14MB,請先壓縮或分割";
   $("go").disabled=true;$("s").textContent="上傳並轉錄中…";$("o").value="";
   try{
    const b64=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(",")[1]);x.readAsDataURL(f)});
    const mime=f.type||(/m4a$/i.test(f.name)?"audio/mp4":"audio/mpeg");
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${$("m").value}:generateContent?key=${key}`,{
     method:"POST",headers:{"Content-Type":"application/json"},
     body:JSON.stringify({
      contents:[{parts:[
       {text:`請逐字完整轉錄這段音訊,不可摘要、省略、改寫或潤飾,保留所有語助詞、口吃與重複。語言/輸出:${$("l").value}。依說話內容自然分段,若有多位說話者請標示「說話者1:」等。只輸出逐字稿。`},
       {inline_data:{mime_type:mime,data:b64}}]}],
      generationConfig:{temperature:0,maxOutputTokens:65536}
     })});
    const j=await res.json();
    if(j.error)throw new Error(j.error.message);
    $("o").value=j.candidates[0].content.parts.map(p=>p.text).join("");
    $("s").textContent="完成 ✅"+(j.candidates[0].finishReason=="MAX_TOKENS"?"(輸出已達上限,請分段)":"");
   }catch(e){$("s").textContent="錯誤:"+e.message}
   $("go").disabled=false;
  };
  $("cp").onclick=()=>navigator.clipboard.writeText($("o").value);
  $("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([$("o").value]));a.download="transcript.txt";a.click()};
  </script></body></html>
